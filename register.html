<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — MyApp</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1 class="card-title">Create your account</h1>
      <p class="card-subtitle">Let's get started with your 30 days free trial</p>
    </div>

    <div class="form-group">
      <label class="form-label" for="name">Name<span class="required">*</span></label>
      <input class="form-input" type="text" id="name" placeholder="johndoe" autocomplete="name" />
      <span class="error-msg" id="nameError"></span>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email<span class="required">*</span></label>
      <input class="form-input" type="email" id="email" placeholder="johndoe@gmail.com" autocomplete="email" />
      <span class="error-msg" id="emailError"></span>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password<span class="required">*</span></label>
      <input class="form-input" type="password" id="password" placeholder="********" autocomplete="new-password" />
      <p class="form-hint">Password needs to have a minimal of 8 characters, 1 uppercase and 1 symbol</p>
      <span class="error-msg" id="passwordError"></span>
    </div>

    <div class="form-group">
      <label class="form-label" for="retypePassword">Retype Password<span class="required">*</span></label>
      <input class="form-input" type="password" id="retypePassword" placeholder="********" autocomplete="new-password" />
      <span class="error-msg" id="retypePasswordError"></span>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="agreeTerms" />
      <label for="agreeTerms">I agree to all term, privacy policy and fees</label>
    </div>
    <span class="error-msg" id="termsError" style="margin-top: -16px; margin-bottom: 16px; display: none;"></span>

    <button class="btn-primary" id="signUpBtn" type="button">Sign Up</button>

    <p class="card-footer">
      Already have an account? <a href="/index.html" id="toLogin">Log In</a>
    </p>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="/src/register.js"></script>
</body>
</html>
